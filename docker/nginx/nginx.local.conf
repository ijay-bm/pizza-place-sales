# The single front door of the local stack, one host, plain http.
#
#   /api/*, /sanctum/*   Laravel, through php-fpm
#   everything else      the Vite dev server in the node service, the SPA

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64m;

    # Every Laravel route is under these prefixes, so nginx never asks php-fpm
    # for a static file and needs no copy of apps/api.
    location ~ ^/(api|sanctum)(/|$) {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 120s;
    }

    # The Vite dev server; Upgrade and Connection carry its hot module
    # replacement websocket.
    location / {
        proxy_pass http://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
