; Replaces the image's default pool. Mounted over /usr/local/etc/php-fpm.d/www.conf.

[www]
; The fpm master runs as root to bind and write its pid file; the workers drop
; to app (uid 1000), so bind-mounted writes land as your user, never www-data.
user = app
group = app

listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Lets the container's environment reach getenv(). Laravel reads .env itself.
clear_env = no

; Worker output goes to the container log instead of being discarded.
catch_workers_output = yes
decorate_workers_output = no
