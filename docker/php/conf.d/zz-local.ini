; Local PHP settings. Loaded last, so it overrides the image defaults.

; display_errors stays off: config files are read before Laravel installs its
; error handler, so a deprecation raised there would be printed into the
; response body and break every JSON response. With APP_DEBUG=true Laravel
; renders exceptions itself, and everything still reaches the container log.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M

date.timezone = UTC

; Edited files are picked up on the next request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
