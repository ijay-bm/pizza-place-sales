# The local stack.
#
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml exec php php artisan <command>
#   docker compose -f docker-compose.local.yml exec node npm run <script>
#   docker compose -f docker-compose.local.yml exec mysql mysql -u pizza_place_sales -p pizza_place_sales
#   docker compose -f docker-compose.local.yml logs -f <service>
#
# Interpolated from the root .env, which holds only what compose reads (see
# .env.example). Laravel's configuration is apps/api/.env, mounted with the rest
# of apps/api at /var/www/html. The SPA is served by the Vite dev server in the
# node service; nothing is built locally.

name: pizza-place-sales

x-php-image: &php-image
  image: pizza-place-sales-php:local
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: base
    args:
      PHP_VERSION: ${PHP_VERSION:-8.5}
      UID: ${UID:-1000}
      GID: ${GID:-1000}

services:
  # ---------------------------------------------------------------- Database
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pizza_place_sales}
      MYSQL_USER: ${DB_USERNAME:-pizza_place_sales}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - pizza-place-sales
    healthcheck:
      # Over TCP: the image's first-run initialization serves the socket only,
      # so this passes once the real server accepts connections.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ----------------------------------------------------------- Test database
  # phpunit.xml points DB_HOST here, so a test run never touches the database
  # above. Its data lives in memory and is gone when the container stops.
  mysql-test:
    image: mysql:${MYSQL_VERSION:-8.4}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_TEST_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: testing
      MYSQL_USER: ${DB_USERNAME:-pizza_place_sales}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    tmpfs:
      - /var/lib/mysql
    networks:
      - pizza-place-sales
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ------------------------------------------------------- PHP dependencies
  # Runs to completion before anything executes PHP. vendor/ is not committed,
  # so a fresh clone has none and a branch switch can leave it stale.
  composer:
    <<: *php-image
    restart: "no"
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./apps/api:/var/www/html
    networks:
      - pizza-place-sales
    command: ["composer", "install", "--no-interaction", "--prefer-dist", "--no-progress"]

  # --------------------------------------------------------------------- PHP
  php:
    <<: *php-image
    restart: unless-stopped
    working_dir: /var/www/html
    # The fpm master binds as root; www.conf drops the workers to uid 1000.
    user: root
    volumes:
      - ./apps/api:/var/www/html
      - ./docker/php/conf.d/zz-local.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    networks:
      - pizza-place-sales
    depends_on:
      mysql:
        condition: service_healthy
      composer:
        condition: service_completed_successfully

  # -------------------------------------------------------------------- Node
  # Installs node_modules from the lockfile when the lockfile is newer than
  # what is installed, then runs the Vite dev server. Run npm through it:
  #   docker compose -f docker-compose.local.yml exec node npm run type-check
  node:
    image: node:${NODE_VERSION:-24}-bookworm-slim
    restart: unless-stopped
    # Delivers the stop signal to the dev server.
    init: true
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    command:
      - sh
      - -c
      - |
        if [ ! -f node_modules/.package-lock.json ] \
          || [ package-lock.json -nt node_modules/.package-lock.json ]; then
          npm ci --no-audit --no-fund
        fi
        exec npm run dev
    environment:
      # The browser reaches Vite's hot module replacement websocket through
      # nginx, on this port; apps/web/vite.config.ts reads it.
      HTTP_PORT: ${HTTP_PORT:-8080}
      # The stock image has no passwd entry for uid 1000, so HOME would be /,
      # where npm fails to write its cache.
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
      npm_config_update_notifier: "false"
    volumes:
      - .:/var/www/html
    networks:
      - pizza-place-sales

  # ------------------------------------------------------------------- nginx
  nginx:
    image: nginx:${NGINX_VERSION:-1.27}-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pizza-place-sales
    depends_on:
      php:
        condition: service_started
      node:
        condition: service_started

volumes:
  mysqldata:

networks:
  pizza-place-sales:
    driver: bridge
